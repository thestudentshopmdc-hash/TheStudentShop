<script>
  
  //---Đổi MenuUserName---
  async function UpdateMenuUserName() {
    const MenuName = document.getElementById("MenuUserName")
    const { data: { user }, error } =
      await supabaseClient.auth.getUser()
    if (error || !user) {
      MenuName.textContent = "Chưa có tên"
      return
    }
    MenuName.textContent = user.user_metadata.name || "Chưa có tên"
  }
  //---Theo dõi trạng thái đăng nhập---
  supabaseClient.auth.onAuthStateChange(() => {
    setTimeout(() => {
      UpdateMenuUserName()
    }, 0)
  })
  //---Cập nhật lần đầu khi mở trang---
  UpdateMenuUserName()
//----link---//
  const SignUpPageText = document.getElementById("signUpProduct");
  SignUpPageText.addEventListener("click",async () => {
    const { data: { session }, error} = await supabaseClient.auth.getSession()

      alert("Vui lòng đăng nhập để thực hiện đăng ký sản phẩm")
      return
    }
    window.location.href = "LuuYVaChinhSach/LuuYKhiDangKy.html";
