<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin tài khoản</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="AccountIn4.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <a href= "index.html">
         <img id="TrangChuIcon" src="home.png" height="45" width="45" alt="Trang chủ"></img>
    </a>
    <h1>Thông tin tài khoản</h1>
    <p id="AccountID">ID tài khoản: không có đữ liệu</p>
    <p id="AccountUsername">Tên tài khoản: không có đữ liệu</p>
    <p id="AccountEmail">Email tài khoản: không có đữ liệu</p>
    <p id="AccountCreatedAt">Thời gian đăng ký tài khoản: không có đữ liệu</p>


    <script>
      const supabaseUrl = "https://rsndakviombsnwebuegy.supabase.co"
      const supabaseKey = "sb_publishable_jLDAR7Kpb6W65lgmvpVSMA_9shoqFxk"

      const supabaseClient = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      )

      const AccountID = document.getElementById("AccountID")
      const AccountUsername = document.getElementById("AccountUsername")
      const AccountEmail = document.getElementById("AccountEmail")
      const AccountCreatedAt = document.getElementById("AccountCreatedAt")

      async function GetAccountIn4() {
        const { data: { user }, error } = await supabaseClient.auth.getUser()
        if (error || !user) {
          AccountID.textContent = "ID tài khoản: không có dữ liệu"
          AccountUsername.textContent = "Tên tài khoản: không có dữ liệu"
          AccountEmail.textContent = "Email tài khoản: không có dữ liệu"
          AccountCreatedAt.textContent = "Thời gian đăng ký tài khoản: không có dữ liệu"
          return
        }
        AccountID.textContent = "ID tài khoản: " + user.id
        AccountUsername.textContent = "Tên tài khoản: " + user.user_metadata.name
        AccountEmail.textContent = "Email tài khoản: " + user.email
        AccountCreatedAt.textContent = "Thời gian đăng ký tài khoản: " + new Date(user.created_at).toLocaleString("vi-VN")
        
      }
      GetAccountIn4()
    </script>
  </body>
</html>
